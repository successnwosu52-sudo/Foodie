    <main>
      <section class="grid gap-6 px-5 py-14 lg:grid-cols-[1fr_340px] md:px-14">
        <div class="rounded-lg border border-[#d1d5dc] bg-white p-6 shadow-xl">
          <div id="cart-list"></div>
        </div>
        <aside
          class="rounded-lg border border-[#d1d5dc] bg-white p-6 shadow-xl lg:sticky lg:top-24"
        >
          <h2 class="mb-4 text-3xl font-bold">Order Summary</h2>
          <div class="flex justify-between border-b border-[#d1d5dc] py-3">
            <span>Subtotal</span><strong id="subtotal">$0.00</strong>
          </div>
          <div class="flex justify-between border-b border-[#d1d5dc] py-3">
            <span>Service</span><strong id="service">$0.00</strong>
          </div>
          <div class="my-4 flex justify-between text-xl font-bold">
            <span>Total</span><strong id="grand-total">$0.00</strong>
          </div>
          <a
            class="block rounded-3xl bg-red-700 px-6 py-3 text-center font-extrabold text-white hover:scale-[1.02] active:scale-95 transition-all shadow-md shadow-gray-300"
            href="checkout.html"
            >Continue to Checkout</a
          >
          <button
            class="mt-3 w-full rounded-3xl border border-[#C10007] px-6 py-3 font-extrabold text-red-500"
            id="clear-cart"
            type="button"
          >
            Clear cart
          </button>
        </aside>
      </section>

    <main class="grid max-w-4xl place-items-center p-6 mx-auto mt-6">
    <section class="grid w-full max-w-5xl overflow-hidden border border-red-700 bg-white lg:grid-cols-2 rounded-2xl shadow-2xl ">

      <form id="login-form" class="grid content-center gap-4 p-8 md:p-14">

        <p class="text-sm font-extrabold uppercase tracking-widest text-red-700">Welcome back</p>
        <h1 class="text-4xl text-black font-extrabold">Login to Foodie</h1>

        <label class="grid gap-2 font-black">Email
         <input class="rounded-md border border-red-700 bg-gray-50 p-3 font-normal" type="email" placeholder="Enter email" required>
        </label>

        <label class="grid gap-2 font-black">Password
         <input class="rounded-md border border-red-700 bg-gray-50 p-3 font-normal" type="password" placeholder="Enter password" required>
        </label>

        <button class="rounded-md bg-red-700 px-6 py-4 text-white font-bold cursor-pointer hover:scale-[1.02] active:scale-95 transition-all shadow-md shadow-gray-300 " type="submit">Log In</button>

        <p class="min-h-6 font-bold text-green-700" id="login-status"></p>
        <p class="text-gray-500">New to Foodie? Create a profile after checkout and save your favorite meals.</p>
      </form>

    </section>
